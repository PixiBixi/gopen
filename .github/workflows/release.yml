name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || steps.tag.outputs.new_tag }}
    permissions:
      contents: write
      packages: write
      id-token: write      # keyless identity used to sign the provenance attestation
      attestations: write  # store the attestation on the repo
    steps:
      # audit, not block: this job's egress (goreleaser uploads, the
      # sigstore endpoints behind the attestation) moves with every
      # dependency, and a stale allowlist would fail the release after the
      # archives are already built.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Needed by svu below, and by GoReleaser further down.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release publishes artifacts; avoid cache-poisoning vector

      # svu derives the next version from the conventional commits since the
      # last tag, and prints the current one back when nothing warrants a
      # release -- which is the gate below. --v0 keeps a breaking change on a
      # 0.x project from jumping straight to v1.0.0.
      - name: Compute next version
        id: tag
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=caarlos0/svu
          SVU_VERSION: v3.4.1
        run: |
          set -euo pipefail
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"
          svu="${RUNNER_TEMP}/bin/svu"

          current=$("$svu" current)
          next=$("$svu" next --v0)
          if [ "$next" = "$current" ]; then
            echo "No releasable commit since ${current} - nothing to do."
            exit 0
          fi

          echo "Tagging ${next} (previous: ${current})"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${next}" -f "sha=${GITHUB_SHA}" --silent
          echo "new_tag=${next}" >> "$GITHUB_OUTPUT"

      # The tag was created through the API, so the local clone needs it before
      # GoReleaser can read the version off it.
      - name: Fetch tags
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        run: git fetch --tags --force

      # goreleaser-action verifies the cosign signature of the goreleaser
      # binary it downloads; without cosign on PATH it silently skips that check.
      - name: Install cosign
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # goreleaser shells out to syft for the SBOMs and fails the whole release
      # if it is missing, after the archives are already built.
      - name: Install syft
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # A signature says who published; provenance says how it was built (repo,
      # workflow, commit). Verified with `gh attestation verify <file> --repo`.
      - name: Attest build provenance
        if: github.ref_type == 'tag' || steps.tag.outputs.new_tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz,dist/*.zip,dist/checksums.txt'

  # Signing and provenance are only worth having if they verify. goreleaser's
  # own repository runs this after every release; without it a broken signing
  # config ships in silence and the first person to notice is a user.
  verify:
    needs: goreleaser
    if: needs.goreleaser.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.goreleaser.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the published artifacts
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' \
            --pattern 'checksums.txt' \
            --pattern 'checksums.txt.sigstore.json'

      # checksums.txt lists the SHA256 of every archive, so one check covers
      # them all. --ignore-missing tolerates archives we did not download.
      - name: Verify checksums
        run: shasum -a 256 --check --ignore-missing checksums.txt

      # Keyless: the identity is the workflow that signed, not a key. Pinning
      # the identity regexp is what makes the signature mean something. The
      # automated release signs from a push to main, so the SAN ends in
      # refs/heads/main; refs/tags/v only covers the manual tag escape hatch.
      # Do NOT relax this to a bare refs/ prefix - any branch could then sign.
      - name: Verify the cosign signature
        run: |
          set -euo pipefail
          cosign verify-blob \
            --certificate-identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/(heads/main|tags/v[0-9])" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      - name: Verify the build provenance
        run: |
          set -euo pipefail
          for f in *.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
