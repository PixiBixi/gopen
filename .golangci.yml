version: "2"

run:
  timeout: 5m

linters:
  default: standard # govet, staticcheck, errcheck, ineffassign, unused
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errorlint
    - forcetypeassert
    - gosec
    - misspell
    - modernize
    - nilerr
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Output writers: a failed write to stdout/pipe is not actionable here.
      exclude-functions:
        - (*text/tabwriter.Writer).Flush
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors: fully overlaps errcheck, which is tuned above
        - G204 # subprocess with variable: gopen's purpose is to exec git/open;
        #        no shell is involved (args are passed as separate argv)
    revive:
      rules:
        # Style-only rules, not worth the churn on a small single-binary CLI.
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: redefines-builtin-id
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      # gosec on tests is noisy (file perms, variable file inclusion) and not
      # a runtime concern.
      - path: _test\.go
        linters:
          - gosec
