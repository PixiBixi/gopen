version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: gopen
    binary: gopen
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

kos:
  - id: gopen
    # Go 1.27 rejects `go list ""` ("invalid package"), which ko does when this
    # is left to default off the build. Must stay explicit.
    main: .
    repositories:
      - ghcr.io/pixibixi/gopen
    base_image: gcr.io/distroless/static
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    bare: true

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'
  groups:
    - title: Features
      regexp: '^feat:'
      order: 0
    - title: Bug Fixes
      regexp: '^fix:'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: PixiBixi
    name: gopen
  name_template: "{{.ProjectName}} {{.Version}}"
  draft: false
  prerelease: auto
  mode: replace

# Casks, not formulae: goreleaser hard-deprecated `brews`, and a formula is meant
# to build from source while this tap ships prebuilt binaries. Cask is macOS-only.
homebrew_casks:
  - name: gopen
    repository:
      owner: PixiBixi
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/PixiBixi/gopen"
    description: "Open your git repository in the browser at the current branch and directory"
    license: "MIT"
    binaries: [gopen]
    url:
      verified: github.com/PixiBixi/gopen/
    # Brew quarantines cask payloads and these binaries are unsigned, so without
    # this Gatekeeper blocks them. Formulae were never quarantined, so the hook
    # only preserves the behaviour users already had. Drop it once notarised.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gopen"]
          end
